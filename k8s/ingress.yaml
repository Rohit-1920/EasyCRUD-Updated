apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easycrud-ingress
  namespace: easycrud
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 404 from the backend root and from the frontend's static server are both
    # "the target is alive", so treat them as healthy too.
    alb.ingress.kubernetes.io/success-codes: "200-404"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
